[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-editor-backend"
version = "0.1.0"
description = "Backend foundation for the image editor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1.0",
  "pydantic>=2.13,<3.0",
  "uvicorn[standard]>=0.52,<1.0",
  "pillow>=11.0,<12.0",
  "numpy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "python-multipart>=0.0.20,<1.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
